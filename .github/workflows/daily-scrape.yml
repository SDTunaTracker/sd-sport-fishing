name: Daily Scrape

on:
  schedule:
    # Every hour, all 24 hours.  At 14:00 UTC (7am Pacific) run the full daily
    # pipeline (SST, weather, backtest).  All other hours run the fast
    # hourly-only scrape so we don't hammer NOAA/weather APIs 24x per day.
    #
    # NOTE: we deliberately avoid minute :00 — it is the single most
    # oversubscribed slot on GitHub's scheduler and those runs are the first to
    # be throttled/dropped.  Running at :37 markedly improves the hit-rate.  A
    # Cloudflare Worker (cloudflare-worker/scrape-trigger.js) also calls this
    # workflow via workflow_dispatch every hour as a reliable backstop.
    - cron: '37 * * * *'
  workflow_dispatch:  # manual trigger + hourly external (Cloudflare) trigger
    inputs:
      mode:
        description: 'Run mode. "auto" = normal hour/SST-based selection. "full" = force full pipeline regardless of hour/SST.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full

# Serialize scrape runs. Two concurrent runs racing on tracker.db /
# web/sst_grid.json cause rebase conflicts that fail the push step and
# self-perpetuate (failed push leaves SST stale → next run also runs full
# mode → collides again). cancel-in-progress:false lets any active run
# finish; a newer queued run supersedes any older queued run.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: write  # required so the workflow can commit back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          # Manual-dispatch override: if the operator dispatched with mode=full,
          # force full regardless of hour/SST. Empty (cron/API dispatch) or "auto"
          # falls through to the normal selector below.
          DISPATCH_MODE="${{ github.event.inputs.mode }}"
          if [ "$DISPATCH_MODE" = "full" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "=== Mode: FULL (forced by workflow_dispatch input) ==="
            exit 0
          fi

          # Self-healing selector. The original design hard-gated the full pipeline on
          # `date -u +%H == 14`, but GitHub cron drift routinely shifts the :37 crontab
          # to 13:xx UTC — meaning the daily SST/weather/backtest run stops
          # firing for weeks at a time. Instead: run full whenever offshore SST is
          # stale, and always run full at the target 14 UTC slot regardless.
          # Stale = 60-Mile Bank SST row, web/sst_grid.json date or (once real)
          # web/currents_grid.json refTime too old. See src/run_mode.py: the
          # buoy row alone stayed fresh while the offshore grid went 6 days stale.
          HOUR=$(date -u +%H)
          STALE=$(python -m src.run_mode || echo 1)
          if [ "$HOUR" = "14" ] || [ "$STALE" = "1" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "=== Mode: FULL (hour=$HOUR, stale=$STALE) ==="
          else
            echo "mode=hourly" >> $GITHUB_OUTPUT
            echo "=== Mode: HOURLY (hour=$HOUR, stale=$STALE) ==="
          fi

      - name: Run scrape
        env:
          # A failed core landing exits 2 locally; in CI keep going so the
          # commit step still saves everything else (completeness alerts fire).
          SD_SOFT_EXIT: "1"
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            echo "=== Full daily run (SST, weather, backtest) ==="
            python -m src.main
          else
            echo "=== Hourly scrape (fast) ==="
            python -m src.main --hourly
          fi

      - name: Bait at the barge (Everingham Bait Report)
        # Dormant until the owner sets the repo variable BAIT_REPORT_ENABLED to
        # 'true' (after Everingham OKs it; see docs/research/BAIT_SOURCES.md §6).
        # One ~0.7 KB CSV read per run. Non-fatal: bait never blocks the scrape.
        if: vars.BAIT_REPORT_ENABLED == 'true'
        continue-on-error: true
        run: python -m src.bait

      - name: Fetch SST grid (full mode only)
        if: steps.mode.outputs.mode == 'full'
        run: |
          python3 - <<'PYEOF'
          import json, datetime, urllib.request
          from pathlib import Path

          BBOX   = {'lat_min': 30.0, 'lat_max': 34.5, 'lon_min': -121.5, 'lon_max': -116.0}
          STRIDE = 4
          OUT    = Path('web/sst_grid.json')

          def fetch_mur(date_str):
              b, s = BBOX, STRIDE
              t   = f'{date_str}T09:00:00Z'
              url = (
                  'https://coastwatch.pfeg.noaa.gov/erddap/griddap/jplMURSST41.json'
                  f'?analysed_sst'
                  f'[({t}):1:({t})]'
                  f'[({b["lat_min"]}):{ s}:({b["lat_max"]})]'
                  f'[({b["lon_min"]}):{ s}:({b["lon_max"]})]'
              )
              req = urllib.request.Request(url, headers={'User-Agent': 'thetunatracker.com/sst-ingest'})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read())
              tbl  = data.get('table', {})
              cols = tbl.get('columnNames', [])
              lat_i, lon_i, sst_i = cols.index('latitude'), cols.index('longitude'), cols.index('analysed_sst')
              rows = tbl.get('rows', [])
              if len(rows) < 20:
                  raise ValueError(f'too few rows: {len(rows)}')
              lat_set, lon_set = set(), set()
              for r in rows:
                  if r[sst_i] is not None:
                      lat_set.add(round(float(r[lat_i]), 4))
                      lon_set.add(round(float(r[lon_i]), 4))
              lats = sorted(lat_set)
              lons = sorted(lon_set)
              ny, nx = len(lats), len(lons)
              if ny < 5 or nx < 5:
                  raise ValueError(f'grid too small: {ny}x{nx}')
              lat_idx = {v: i for i, v in enumerate(lats)}
              lon_idx = {v: i for i, v in enumerate(lons)}
              dlat = round(lats[1] - lats[0], 5) if ny > 1 else 0.04
              dlon = round(lons[1] - lons[0], 5) if nx > 1 else 0.04
              values_c = [None] * (ny * nx)
              for r in rows:
                  sst_c = r[sst_i]
                  if sst_c is None:
                      continue
                  sst_c = float(sst_c)
                  if sst_c > 200:
                      sst_c -= 273.15
                  li  = lat_idx.get(round(float(r[lat_i]), 4))
                  loi = lon_idx.get(round(float(r[lon_i]), 4))
                  if li is not None and loi is not None:
                      values_c[li * nx + loi] = round(sst_c, 3)
              return {
                  'date': date_str,
                  'latMin': b['lat_min'], 'latMax': b['lat_max'],
                  'lonMin': b['lon_min'], 'lonMax': b['lon_max'],
                  'ny': ny, 'nx': nx, 'dlat': dlat, 'dlon': dlon,
                  'lats': lats, 'lons': lons, 'values_c': values_c,
              }

          today = datetime.date.today()
          grid  = None
          # MUR on public CoastWatch ERDDAP typically lags 2–4 days
          for days_back in range(2, 8):
              d = today - datetime.timedelta(days=days_back)
              try:
                  grid = fetch_mur(d.isoformat())
                  valid = sum(1 for v in grid['values_c'] if v is not None)
                  print(f'  Fetched {d}: {grid["ny"]}x{grid["nx"]}, {valid:,} valid cells')
                  break
              except Exception as e:
                  print(f'  {d}: {e}')

          if grid:
              OUT.write_text(json.dumps(grid, separators=(',', ':')), encoding='utf-8')
              print(f'Wrote {OUT} ({OUT.stat().st_size:,} bytes)')
          else:
              print('WARNING: all ERDDAP attempts failed — keeping existing sst_grid.json')
          PYEOF

      - name: Surf forecast and MOP run archive (CDIP / Scripps)
        # src/surf: snapshots each new CDIP MOP forecast run into tracker.db
        # (surf_runs, for lead-time verification) and writes
        # web/api/v1/surf.json for /sd/surf. Free public data. Never fails the run.
        continue-on-error: true
        run: |
          python -m src.surf.runs || echo "::warning::surf run archive failed"
          python -m src.surf.forecast || echo "::warning::surf forecast failed"

      - name: More surf spots (Surftracker, twice a day)
        # src/surf/spots.py: ~50 more San Diego County spots with default
        # settings, forecast by the same model (~4 CDIP requests each, ~4 min
        # cold). Runs on the daily full run and at 02 UTC (evening PT) only,
        # never every hour. Writes web/api/v1/surf_spots.json. Never fails the run.
        continue-on-error: true
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ steps.mode.outputs.mode }}" = "full" ] || [ "$HOUR" = "02" ] || [ ! -f web/api/v1/surf_spots.json ]; then
            python -m src.surf.spots || echo "::warning::surf spots failed"
          else
            echo "Skipping surf spots (hour=$HOUR, mode=${{ steps.mode.outputs.mode }})"
          fi

      - name: Paddle spots (Surftracker Paddle mode, twice a day)
        # src/surf/paddle.py: wind (ECMWF), NOAA tides (La Jolla + San Diego Bay)
        # and surf from surf.json/surf_spots.json for ~12 paddle spots, with a
        # rule-of-thumb Good/OK/Hard rating. Same cadence as surf spots.
        # Writes web/api/v1/paddle_spots.json. Never fails the run.
        continue-on-error: true
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ steps.mode.outputs.mode }}" = "full" ] || [ "$HOUR" = "02" ] || [ ! -f web/api/v1/paddle_spots.json ]; then
            python -m src.surf.paddle || echo "::warning::paddle spots failed"
          else
            echo "Skipping paddle spots (hour=$HOUR, mode=${{ steps.mode.outputs.mode }})"
          fi

      - name: Surf report (Surftracker written report)
        # src/surf/report.py: the written Today report, 5-day outlook, region
        # lines and paddle note, from surf.json + surf_spots.json + NWS text.
        # Claude (claude-haiku-5-5) writes it with strict fact checks; the
        # template writer is the fallback (no key, API down, failed checks).
        # Rewrites at most every 3 h unless the story changes (about 9 calls a
        # day, well under $1 a month). Writes web/api/v1/surf_report.json. Never fails the run.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.surf.report || echo "::warning::surf report failed"

      - name: Surf cam live check (Surftracker, once a day)
        # src/surf/cams.py: YouTube oEmbed + thumbnail check (removed / embed off) for each cam
        # in web/api/v1/surf_cams.json (2 keyless requests per cam, no API key).
        # Daily full run only (or if the file is missing). Writes
        # web/api/v1/surf_cams_status.json. Never fails the run.
        continue-on-error: true
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ] || [ ! -f web/api/v1/surf_cams_status.json ]; then
            python -m src.surf.cams || echo "::warning::surf cam check failed"
          else
            echo "Skipping surf cam check (mode=${{ steps.mode.outputs.mode }})"
          fi

      - name: Paddle race forecast (Paddle Tracker)
        # src/paddle/forecast.py: scores each leg of races in the next 7 days
        # (web/api/v1/paddle_races.json + paddle_courses/) with the surf code's
        # ECMWF wind, NOAA currents and CDIP swell. No requests when no race is
        # in range. Writes web/api/v1/paddle_race_forecast.json and
        # paddle_race_conditions.json. Never fails the run.
        continue-on-error: true
        run: |
          python -m src.paddle.forecast || echo "::warning::paddle race forecast failed"
          # past races: race-day wind from the ERA5 archive, fetched once per race
          python -m src.paddle.conditions || echo "::warning::paddle race conditions failed"

      - name: Fetch currents grid (full mode, Copernicus Marine)
        # Real currents for the Charts map (src/currents_cmems.py). Skips until
        # the owner adds the two COPERNICUSMARINE_* secrets; the map keeps its
        # DEMO layer meanwhile. Never fails the run.
        if: steps.mode.outputs.mode == 'full'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ]; then
            echo "Skipping currents (no Copernicus credentials)."; exit 0
          fi
          pip install --quiet copernicusmarine || { echo "::warning::copernicusmarine install failed"; exit 0; }
          python -m src.currents_cmems

      - name: Refresh YouTube trip videos (full mode)
        # Boat-page videos via the YouTube Data API (src/youtube.py). Skips until
        # the YOUTUBE_API_KEY secret exists. Never fails the run.
        if: steps.mode.outputs.mode == 'full'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "Skipping YouTube (no key)."; exit 0; fi
          python -m src.youtube || echo "::warning::YouTube refresh failed"

      - name: Push admin data to the owner dashboard
        # build/admin.json (scrape health, backtests, review queue) is written by
        # src/export.py and never committed: the repo is public. The analytics
        # Worker stores it in D1 and serves it only behind Cloudflare Access.
        # Skips quietly until the ADMIN_INGEST_TOKEN secret exists.
        env:
          ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        run: |
          if [ -z "$ADMIN_INGEST_TOKEN" ] || [ ! -f build/admin.json ]; then
            echo "Skipping admin push (no token or no build/admin.json)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/admin-push.txt -w '%{http_code}' -X POST             -H "Authorization: Bearer $ADMIN_INGEST_TOKEN" -H 'Content-Type: application/json'             --data-binary @build/admin.json https://thetunatracker.com/a/admin || echo 000)
          echo "admin push: HTTP $code"; cat /tmp/admin-push.txt || true; echo
          if [ "$code" != "200" ]; then echo "::warning::Admin data push failed (HTTP $code)"; fi

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.db web/data.js web/api/v1/app.json web/sitemap.xml web/sd web/sst_grid.json
          for f in web/api/v1/enso.json web/api/v1/boat_videos.json web/api/v1/bait_now.json web/api/v1/surf.json web/api/v1/surf_spots.json web/api/v1/surf_report.json web/api/v1/surf_cams_status.json web/api/v1/paddle_spots.json web/api/v1/paddle_race_forecast.json web/api/v1/paddle_race_conditions.json web/api/v1/buoys.json web/currents_grid.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          # Per-region data files: data-region-oc_la.js, ... (src/export.py) and
          # data-region-sfbay.js (src/export_sfbay.py).
          if ls web/data-region-*.js >/dev/null 2>&1; then git add web/data-region-*.js; fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit --no-verify -m "Scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for i in $(seq 1 5); do
              # Recover from any half-finished rebase left by a prior retry —
              # otherwise the next `git pull --rebase` refuses to start.
              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD
              git pull --rebase origin main && git push origin main && { pushed=1; break; }
              echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
            done
            [ "$pushed" = 1 ] || { echo "push still failing after retries"; exit 1; }
          fi

  # BloodyDecks paddies collection moved to its own workflow:
  # .github/workflows/paddies.yml
