name: Daily Scrape

on:
  schedule:
    # Every hour, all 24 hours.  At 14:00 UTC (7am Pacific) run the full daily
    # pipeline (SST, weather, Reddit, backtest).  All other hours run the fast
    # hourly-only scrape so we don't hammer NOAA/weather APIs 24x per day.
    - cron: '0 * * * *'
  workflow_dispatch:  # allow manual triggering from the Actions tab

permissions:
  contents: write  # required so the workflow can commit back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrape
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "14" ]; then
            echo "=== Full daily run (SST, weather, Reddit, backtest) ==="
            python -m src.main
          else
            echo "=== Hourly scrape (fast) ==="
            python -m src.main --hourly
          fi

      - name: Stamp index.html with data.js hash and build commit
        run: |
          python3 - <<'EOF'
          import hashlib, os, re, pathlib, datetime
          web      = pathlib.Path("web")
          data_js  = web / "data.js"
          index    = web / "index.html"
          if not data_js.exists() or not index.exists():
              print("Skipping stamp — missing files"); raise SystemExit(0)
          data_hash  = hashlib.md5(data_js.read_bytes()).hexdigest()[:8]
          sha        = (os.environ.get("GITHUB_SHA") or "")[:7]
          build_time = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          text = index.read_text(encoding="utf-8")
          text = re.sub(r'src="data\.js(\?v=[^"]*)?"', f'src="data.js?v={data_hash}"', text)
          text = re.sub(r'\n?<meta name="build-(time|commit)"[^>]*>', '', text)
          if sha:
              tags = (f'\n<meta name="build-time" content="{build_time}">'
                      f'\n<meta name="build-commit" content="{sha}">')
              text = text.replace('<meta charset="utf-8">', f'<meta charset="utf-8">{tags}', 1)
          index.write_text(text, encoding="utf-8")
          print(f"Stamped index.html: data.js?v={data_hash}  commit={sha or 'none'}")
          EOF

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.db web/data.js web/index.html web/sitemap.xml web/sd
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit --no-verify -m "Scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for i in $(seq 1 5); do
              git pull --rebase origin main && git push origin main && { pushed=1; break; }
              echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
            done
            [ "$pushed" = 1 ] || { echo "push still failing after retries"; exit 1; }
          fi
