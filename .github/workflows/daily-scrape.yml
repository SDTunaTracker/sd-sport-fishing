name: Daily Scrape

on:
  schedule:
    # Every hour, all 24 hours.  At 14:00 UTC (7am Pacific) run the full daily
    # pipeline (SST, weather, Reddit, backtest).  All other hours run the fast
    # hourly-only scrape so we don't hammer NOAA/weather APIs 24x per day.
    #
    # NOTE: we deliberately avoid minute :00 — it is the single most
    # oversubscribed slot on GitHub's scheduler and those runs are the first to
    # be throttled/dropped.  Running at :37 markedly improves the hit-rate.  A
    # Cloudflare Worker (cloudflare-worker/scrape-trigger.js) also calls this
    # workflow via workflow_dispatch every hour as a reliable backstop.
    - cron: '37 * * * *'
  workflow_dispatch:  # manual trigger + hourly external (Cloudflare) trigger

permissions:
  contents: write  # required so the workflow can commit back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          # Self-healing selector. The original design hard-gated the full pipeline on
          # `date -u +%H == 14`, but GitHub cron drift routinely shifts the :37 crontab
          # to 13:xx UTC — meaning the daily SST/weather/reddit/backtest run stops
          # firing for weeks at a time. Instead: run full whenever offshore SST is
          # stale, and always run full at the target 14 UTC slot regardless.
          HOUR=$(date -u +%H)
          STALE=1
          if [ -f tracker.db ]; then
            STALE=$(python3 - <<'PYEOF'
          import sqlite3
          from datetime import date, timedelta
          try:
              c = sqlite3.connect('tracker.db')
              r = c.execute("SELECT MAX(date) FROM ocean_temps WHERE location='60-Mile Bank'").fetchone()
              latest = r[0] if r else None
              cutoff = (date.today() - timedelta(days=5)).isoformat()  # MUR lag ≤6 days
              print(0 if latest and latest >= cutoff else 1)
          except Exception:
              print(1)
          PYEOF
            )
          fi
          if [ "$HOUR" = "14" ] || [ "$STALE" = "1" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "=== Mode: FULL (hour=$HOUR, stale=$STALE) ==="
          else
            echo "mode=hourly" >> $GITHUB_OUTPUT
            echo "=== Mode: HOURLY (hour=$HOUR, stale=$STALE) ==="
          fi

      - name: Run scrape
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            echo "=== Full daily run (SST, weather, Reddit, backtest) ==="
            python -m src.main
          else
            echo "=== Hourly scrape (fast) ==="
            python -m src.main --hourly
          fi

      - name: Fetch SST grid (full mode only)
        if: steps.mode.outputs.mode == 'full'
        run: |
          python3 - <<'PYEOF'
          import json, datetime, urllib.request
          from pathlib import Path

          BBOX   = {'lat_min': 30.0, 'lat_max': 34.5, 'lon_min': -121.5, 'lon_max': -116.0}
          STRIDE = 4
          OUT    = Path('web/sst_grid.json')

          def fetch_mur(date_str):
              b, s = BBOX, STRIDE
              t   = f'{date_str}T09:00:00Z'
              url = (
                  'https://coastwatch.pfeg.noaa.gov/erddap/griddap/jplMURSST41.json'
                  f'?analysed_sst'
                  f'[({t}):1:({t})]'
                  f'[({b["lat_min"]}):{ s}:({b["lat_max"]})]'
                  f'[({b["lon_min"]}):{ s}:({b["lon_max"]})]'
              )
              req = urllib.request.Request(url, headers={'User-Agent': 'thetunatracker.com/sst-ingest'})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read())
              tbl  = data.get('table', {})
              cols = tbl.get('columnNames', [])
              lat_i, lon_i, sst_i = cols.index('latitude'), cols.index('longitude'), cols.index('analysed_sst')
              rows = tbl.get('rows', [])
              if len(rows) < 20:
                  raise ValueError(f'too few rows: {len(rows)}')
              lat_set, lon_set = set(), set()
              for r in rows:
                  if r[sst_i] is not None:
                      lat_set.add(round(float(r[lat_i]), 4))
                      lon_set.add(round(float(r[lon_i]), 4))
              lats = sorted(lat_set)
              lons = sorted(lon_set)
              ny, nx = len(lats), len(lons)
              if ny < 5 or nx < 5:
                  raise ValueError(f'grid too small: {ny}x{nx}')
              lat_idx = {v: i for i, v in enumerate(lats)}
              lon_idx = {v: i for i, v in enumerate(lons)}
              dlat = round(lats[1] - lats[0], 5) if ny > 1 else 0.04
              dlon = round(lons[1] - lons[0], 5) if nx > 1 else 0.04
              values_c = [None] * (ny * nx)
              for r in rows:
                  sst_c = r[sst_i]
                  if sst_c is None:
                      continue
                  sst_c = float(sst_c)
                  if sst_c > 200:
                      sst_c -= 273.15
                  li  = lat_idx.get(round(float(r[lat_i]), 4))
                  loi = lon_idx.get(round(float(r[lon_i]), 4))
                  if li is not None and loi is not None:
                      values_c[li * nx + loi] = round(sst_c, 3)
              return {
                  'date': date_str,
                  'latMin': b['lat_min'], 'latMax': b['lat_max'],
                  'lonMin': b['lon_min'], 'lonMax': b['lon_max'],
                  'ny': ny, 'nx': nx, 'dlat': dlat, 'dlon': dlon,
                  'lats': lats, 'lons': lons, 'values_c': values_c,
              }

          today = datetime.date.today()
          grid  = None
          # MUR on public CoastWatch ERDDAP typically lags 2–4 days
          for days_back in range(2, 8):
              d = today - datetime.timedelta(days=days_back)
              try:
                  grid = fetch_mur(d.isoformat())
                  valid = sum(1 for v in grid['values_c'] if v is not None)
                  print(f'  Fetched {d}: {grid["ny"]}x{grid["nx"]}, {valid:,} valid cells')
                  break
              except Exception as e:
                  print(f'  {d}: {e}')

          if grid:
              OUT.write_text(json.dumps(grid, separators=(',', ':')), encoding='utf-8')
              print(f'Wrote {OUT} ({OUT.stat().st_size:,} bytes)')
          else:
              print('WARNING: all ERDDAP attempts failed — keeping existing sst_grid.json')
          PYEOF

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.db web/data.js web/sitemap.xml web/sd web/sst_grid.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit --no-verify -m "Scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for i in $(seq 1 5); do
              git pull --rebase origin main && git push origin main && { pushed=1; break; }
              echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
            done
            [ "$pushed" = 1 ] || { echo "push still failing after retries"; exit 1; }
          fi
