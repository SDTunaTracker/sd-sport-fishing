name: Daily Scrape

on:
  schedule:
    # Every hour, all 24 hours.  At 14:00 UTC (7am Pacific) run the full daily
    # pipeline (SST, weather, Reddit, backtest).  All other hours run the fast
    # hourly-only scrape so we don't hammer NOAA/weather APIs 24x per day.
    - cron: '0 * * * *'
  workflow_dispatch:  # allow manual triggering from the Actions tab

permissions:
  contents: write  # required so the workflow can commit back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrape
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "14" ]; then
            echo "=== Full daily run (SST, weather, Reddit, backtest) ==="
            python -m src.main
          else
            echo "=== Hourly scrape (fast) ==="
            python -m src.main --hourly
          fi

      - name: Fetch SST grid (daily, 14 UTC only)
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" != "14" ]; then
            echo "Hourly run — skipping SST grid fetch"
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, datetime, urllib.request
          from pathlib import Path

          BBOX   = {'lat_min': 30.0, 'lat_max': 34.5, 'lon_min': -121.5, 'lon_max': -116.0}
          STRIDE = 4
          OUT    = Path('web/sst_grid.json')

          def fetch_mur(date_str):
              b, s = BBOX, STRIDE
              t   = f'{date_str}T09:00:00Z'
              url = (
                  'https://coastwatch.pfeg.noaa.gov/erddap/griddap/jplMURSST41.json'
                  f'?analysed_sst'
                  f'[({t}):1:({t})]'
                  f'[({b["lat_min"]}):{ s}:({b["lat_max"]})]'
                  f'[({b["lon_min"]}):{ s}:({b["lon_max"]})]'
              )
              req = urllib.request.Request(url, headers={'User-Agent': 'thetunatracker.com/sst-ingest'})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read())
              tbl  = data.get('table', {})
              cols = tbl.get('columnNames', [])
              lat_i, lon_i, sst_i = cols.index('latitude'), cols.index('longitude'), cols.index('analysed_sst')
              rows = tbl.get('rows', [])
              if len(rows) < 20:
                  raise ValueError(f'too few rows: {len(rows)}')
              lat_set, lon_set = set(), set()
              for r in rows:
                  if r[sst_i] is not None:
                      lat_set.add(round(float(r[lat_i]), 4))
                      lon_set.add(round(float(r[lon_i]), 4))
              lats = sorted(lat_set)
              lons = sorted(lon_set)
              ny, nx = len(lats), len(lons)
              if ny < 5 or nx < 5:
                  raise ValueError(f'grid too small: {ny}x{nx}')
              lat_idx = {v: i for i, v in enumerate(lats)}
              lon_idx = {v: i for i, v in enumerate(lons)}
              dlat = round(lats[1] - lats[0], 5) if ny > 1 else 0.04
              dlon = round(lons[1] - lons[0], 5) if nx > 1 else 0.04
              values_c = [None] * (ny * nx)
              for r in rows:
                  sst_c = r[sst_i]
                  if sst_c is None:
                      continue
                  sst_c = float(sst_c)
                  if sst_c > 200:
                      sst_c -= 273.15
                  li  = lat_idx.get(round(float(r[lat_i]), 4))
                  loi = lon_idx.get(round(float(r[lon_i]), 4))
                  if li is not None and loi is not None:
                      values_c[li * nx + loi] = round(sst_c, 3)
              return {
                  'date': date_str,
                  'latMin': b['lat_min'], 'latMax': b['lat_max'],
                  'lonMin': b['lon_min'], 'lonMax': b['lon_max'],
                  'ny': ny, 'nx': nx, 'dlat': dlat, 'dlon': dlon,
                  'lats': lats, 'lons': lons, 'values_c': values_c,
              }

          today = datetime.date.today()
          grid  = None
          # MUR on public CoastWatch ERDDAP typically lags 2–4 days
          for days_back in range(2, 8):
              d = today - datetime.timedelta(days=days_back)
              try:
                  grid = fetch_mur(d.isoformat())
                  valid = sum(1 for v in grid['values_c'] if v is not None)
                  print(f'  Fetched {d}: {grid["ny"]}x{grid["nx"]}, {valid:,} valid cells')
                  break
              except Exception as e:
                  print(f'  {d}: {e}')

          if grid:
              OUT.write_text(json.dumps(grid, separators=(',', ':')), encoding='utf-8')
              print(f'Wrote {OUT} ({OUT.stat().st_size:,} bytes)')
          else:
              print('WARNING: all ERDDAP attempts failed — keeping existing sst_grid.json')
          PYEOF

      - name: Stamp index.html with data.js hash and build commit
        run: |
          python3 - <<'EOF'
          import hashlib, os, re, pathlib, datetime
          web      = pathlib.Path("web")
          data_js  = web / "data.js"
          index    = web / "index.html"
          if not data_js.exists() or not index.exists():
              print("Skipping stamp — missing files"); raise SystemExit(0)
          data_hash  = hashlib.md5(data_js.read_bytes()).hexdigest()[:8]
          sha        = (os.environ.get("GITHUB_SHA") or "")[:7]
          build_time = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          text = index.read_text(encoding="utf-8")
          text = re.sub(r'src="data\.js(\?v=[^"]*)?"', f'src="data.js?v={data_hash}"', text)
          text = re.sub(r'\n?<meta name="build-(time|commit)"[^>]*>', '', text)
          if sha:
              tags = (f'\n<meta name="build-time" content="{build_time}">'
                      f'\n<meta name="build-commit" content="{sha}">')
              text = text.replace('<meta charset="utf-8">', f'<meta charset="utf-8">{tags}', 1)
          index.write_text(text, encoding="utf-8")
          print(f"Stamped index.html: data.js?v={data_hash}  commit={sha or 'none'}")
          EOF

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.db web/data.js web/index.html web/sitemap.xml web/sd web/sst_grid.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit --no-verify -m "Scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for i in $(seq 1 5); do
              git pull --rebase origin main && git push origin main && { pushed=1; break; }
              echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
            done
            [ "$pushed" = 1 ] || { echo "push still failing after retries"; exit 1; }
          fi
