name: AIS Vessel Discovery

on:
  schedule:
    # 5 AM Pacific (12 UTC) — morning departure window
    - cron: '0 12 * * *'
    # 1 PM Pacific (20 UTC) — afternoon return window
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'How long to listen (seconds)'
        default: '7200'
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "websockets>=13,<17"

      - name: Run AIS discovery
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          DURATION=${{ github.event.inputs.duration_seconds || '7200' }}
          echo "Listening for ${DURATION}s"
          python scripts/discover_mmsi.py \
            --duration "$DURATION" \
            --output data/ais-discoveries.json \
            --boats-file data/boat-mmsi.json \
            --append

      - name: Generate ais_positions.json
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          disc_path = Path('data/ais-discoveries.json')
          mmsi_path = Path('data/vessel_mmsi.json')
          out_path  = Path('web/ais_positions.json')

          discoveries = json.loads(disc_path.read_text()) if disc_path.exists() else {}
          mmsi_data   = json.loads(mmsi_path.read_text()) if mmsi_path.exists() else {}
          known       = mmsi_data.get('vessels', {})
          obs         = discoveries.get('all_observed_vessels', {})

          positions = []
          for mmsi, v in obs.items():
              boat_name = v.get('matched_our_boat')
              if not boat_name:
                  continue
              lat, lng = v.get('lat'), v.get('lng')
              if lat is None or lng is None:
                  continue
              positions.append({
                  'mmsi':       mmsi,
                  'name':       boat_name,
                  'landing':    known.get(mmsi, {}).get('landing', ''),
                  'lat':        lat,
                  'lng':        lng,
                  'sog':        None,
                  'cog':        None,
                  'heading':    None,
                  'updated_at': v.get('last_seen', ''),
                  'trail':      [],
              })

          out_path.write_text(json.dumps(positions, indent=2))
          print(f"Generated {out_path}: {len(positions)} vessels")
          EOF

      - name: Commit discoveries
        run: |
          git config user.name "Tuna Tracker AIS Bot"
          git config user.email "bot@thetunatracker.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "AIS discovery: $(date -u +%FT%TZ)"
            pushed=0
            for i in $(seq 1 5); do
              git pull --rebase origin main && git push origin main && { pushed=1; break; }
              echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
            done
            [ "$pushed" = 1 ] || { echo "push still failing after retries"; exit 1; }
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/ais-discoveries.json ]; then
            python - <<'EOF'
          import json
          with open('data/ais-discoveries.json') as f:
              data = json.load(f)
          sessions = data.get('_sessions', [])
          last = sessions[-1] if sessions else {}
          obs  = last.get('unique_mmsis_seen', 0)
          msgs = last.get('total_messages', 0)
          matched = last.get('matched_known_boats', [])
          print(f"Messages received   : {msgs}")
          print(f"Unique vessels seen : {obs}")
          print(f"Matched our boats   : {len(matched)}")
          if matched:
              print("Boats found:")
              for b in matched:
                  print(f"  MMSI {b['mmsi']}  {b['name']}")
          all_obs = data.get('all_observed_vessels', {})
          total_matched = sum(
              1 for v in all_obs.values() if v.get('matched_our_boat')
          )
          print(f"\nAll-time matched boats: {total_matched}")
          EOF
          else
            echo "No discoveries file found"
          fi
